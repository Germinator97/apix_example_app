name: apix_example_app

description: "Example app demonstrating all apix features."

publish_to: 'none'

version: 1.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  apix:
    path: ../apix
  dio: ^5.4.0
  flutter_secure_storage: ^10.0.0
  sentry_flutter: ^9.0.0
  # Clean Architecture + BLoC
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0
  get_it: ^7.6.0
  equatable: ^2.0.5
  # Multipart upload demo
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device proof for the v5 probes. Ships with the Flutter SDK, dev-only.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0
  # Uploads debug symbols to Sentry. Without it a release stack trace reads
  # `QKa: Provider<Gx> not found for Ez` — events still arrive, they are just
  # unreadable, so the gap only surfaces in production.
  sentry_dart_plugin: ^3.4.0

# Read by `dart run sentry_dart_plugin`, which must be run after EVERY release
# build — otherwise the symbols on Sentry drift out of step with the binary
# users are running.
#
#     flutter build apk --release
#     dart run sentry_dart_plugin
#
# Credentials live in a gitignored `sentry.properties` at the project root,
# with flat keys (`org`, `project`, `auth_token`) — not the `defaults.*` form
# the sentry-cli binary uses. See README.
#
# This demo app is never distributed and is only ever run in debug, where
# nothing is obfuscated: the block is here to be copied, not because this app
# needs it.
sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  project: apix
  org: germinator

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true