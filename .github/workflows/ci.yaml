name: CI

# This app depends on apix by `path: ../apix`, so it resolves to whatever is
# checked out next to it. Without this workflow, a release of the package can
# silently drift the example app — which is exactly what happened between
# apix 2.1.0 and 2.3.0 (a stale `package:dio` import, and a retry demo that no
# longer described the shipped policy).
#
# That path dependency is also why every job checks out TWO repositories into
# sibling directories:
#
#     $GITHUB_WORKSPACE/
#     ├── apix_example_app/   <- this repo
#     └── apix/               <- the package, so ../apix resolves
#
# A runner clones only the repository that triggered the run, so without the
# second checkout `pub get` fails with "could not find package apix at
# ../apix" — which is what happened the first time this workflow ran.
#
# apix is taken from `develop`, not a tag, on purpose: the point of this CI is
# to catch drift between the package and the app as it happens. A red build
# here after a package change is the signal, not a nuisance.
#
# Flutter is pinned: the app requires Dart SDK ^3.8.0, i.e. Flutter >= 3.32.
# Pinned everywhere but `build-stable`, which exists because a pin cannot see
# the toolchain move.
#
# develop only, like the package: master receives nothing but release merges of
# develop, with the tree develop's run has already tested. And once a week, so
# drift shows up here even when nobody pushes.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.0'
  APIX_REF: develop
  # A scheduled run starts from the default branch, master: check this app out
  # from develop instead, next to the apix develop it is built against.
  SOURCE_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # No apix checkout here: `dart format` does not resolve dependencies.
      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: actions/checkout@v5
        with:
          repository: Germinator97/apix
          ref: ${{ env.APIX_REF }}
          path: apix

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos lib test

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: actions/checkout@v5
        with:
          repository: Germinator97/apix
          ref: ${{ env.APIX_REF }}
          path: apix

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build:
    # Analyze and test both pass on code that does not build: the Android
    # manifest merger rejected this app for months because
    # flutter_secure_storage 10.x requires minSdk 24 while the app declared 21,
    # and nothing in CI compiled it. A green analyze is not a shippable app.
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: actions/checkout@v5
        with:
          repository: Germinator97/apix
          ref: ${{ env.APIX_REF }}
          path: apix

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No --dart-define=SENTRY_DSN here: main.dart falls back to an empty DSN
      # and disables Sentry, so the build must not need a secret.
      #
      # Release, not debug: only the mode that ships runs R8, so only it can
      # fail on a missing shrinking rule — and a failure nothing builds waits
      # for the release to show up.
      - name: Build release APK
        run: flutter build apk --release

  build-stable:
    # The same build on today's Flutter stable, unpinned. Every other job pins
    # 3.32.0, and a pin cannot see Flutter raise its Android floors: Gradle
    # 8.12, AGP 8.7.3 and NDK 27.0 aged here for months, green, until the
    # package's own unpinned job found them. This is how this repository
    # notices on its own. A job of its own rather than a matrix on `build`:
    # an axis would rename that job, and required checks go by name.
    #
    # The committed lock is resolved, not enforced: it pins the SDK's own
    # packages to 3.32.0's, and a newer SDK has to move them.
    name: Build APK (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: actions/checkout@v5
        with:
          repository: Germinator97/apix
          ref: ${{ env.APIX_REF }}
          path: apix

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

  lockfile:
    # Reported separately from analyze/test so a dependency drift reads as a
    # dependency drift, instead of burying the substantive signal. A failure
    # here means the committed lock no longer satisfies the declared
    # constraints — typically after apix changed its own dependencies:
    # re-run `flutter pub get` locally and commit the refreshed lock.
    name: Lockfile is current
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apix_example_app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          path: apix_example_app

      - uses: actions/checkout@v5
        with:
          repository: Germinator97/apix
          ref: ${{ env.APIX_REF }}
          path: apix

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Resolve with the committed lock enforced
        run: flutter pub get --enforce-lockfile
